<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Gestió de Clients</title>
    <link rel="stylesheet" href="/css/style.css"> <!-- CSS SAP Fiori -->
</head>
<body>

<div class="container">

    <h2 th:text="#{client.portal.title}">Portal de Clients</h2>

    <!-- Formulari de selecció d'idioma -->
    <form method="get" id="languageForm" class="form-row">
        <label>Idioma: 
            <select name="lang" onchange="this.form.submit()">
                <option value="ca" th:selected="${#locale.language=='ca'}">Català</option>
                <option value="fr" th:selected="${#locale.language=='fr'}">Français</option>
                <option value="en" th:selected="${#locale.language=='en'}">English</option>
            </select>
        </label>
    </form>

    <!-- Formulari de cerca -->
    <form id="searchForm">

        <div class="search-grid">

            <label>Nom:
                <input type="text" id="searchName" placeholder="Nom">
            </label>

            <label>Cognom:
                <input type="text" id="searchSurname" placeholder="Cognom">
            </label>

            <label>Edat:
                <input type="number" id="searchEdat" placeholder="Edat" min="0">
            </label>

            <label>DNI:
                <input type="text" id="searchDni" placeholder="DNI">
            </label>

            <label>Email:
                <input type="email" id="searchEmail" placeholder="Email">
            </label>

        </div>

        <div class="btn-container">
            <button type="submit" class="btn btn-primary">Cercar</button>
            <button type="button" id="resetBtn" class="btn btn-reset">Reset</button>
        </div>

    </form>

    <div class="btn-container btn-container-left">
        <button id="showAllBtn" class="btn btn-primary">Veure tots els clients</button>
        <button id="addClientBtn" class="btn btn-add">Afegir Client</button>
    </div>

    <!-- Resultats de la cerca -->
    <div id="searchResult">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Cognom</th>
                    <th>Edat</th>
                    <th>DNI</th>
                    <th>Email</th>
                    <th>Adreces</th>
                    <th>Accions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="/js/search-client.js"></script>
</body>
</html>
