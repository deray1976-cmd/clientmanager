<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Crear Client</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<div class="container">

    <h2>Alta de Client</h2>

    <form id="clientForm">

        <fieldset>
            <legend>Dades</legend>

            <div class="form-row">
                <label for="name">Nom *</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-row">
                <label for="surname">Cognom</label>
                <input type="text" id="surname">
            </div>

            <div class="form-row">
                <label for="edat">Edat</label>
                <input type="number" id="edat">
            </div>

            <div class="form-row">
                <label for="dni">DNI</label>
                <input type="text" id="dni">
            </div>

            <div class="form-row">
                <label for="email">Email *</label>
                <input type="email" id="email" required>
            </div>

        </fieldset>

        <fieldset>
            <legend>Adreces</legend>

            <div id="addresses-container">

                <div class="address-block">
                    <div class="form-row">
                        <label for="street1">Carrer</label>
                        <input type="text" id="street1" class="street" required>
                    </div>

                    <div class="form-row">
                        <label for="city1">Ciutat</label>
                        <input type="text" id="city1" class="city" required>
                    </div>

                    <div class="address-actions">
                        <button type="button" class="remove-address-btn btn" disabled>Eliminar</button>
                    </div>
                </div>

            </div>

            <button type="button" id="addAddressBtn" class="btn btn-add">+ Afegir adreça</button>

        </fieldset>

        <div class="btn-container form-actions">
            <button type="submit" class="btn">Desar</button>
            <button type="button" id="resetFormBtn" class="btn btn-reset">Reset</button>
            <button type="button" id="closeFormBtn" class="btn btn-close">Tancar</button>
        </div>

    </form>

</div>

<script src="/js/client-form.js"></script>

</body>
</html>
